<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6826581588">
<title>댕오늘 — 강아지와 가는 곳</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.6 -apple-system, system-ui, sans-serif; margin: 0; color: #2b1d12; background: linear-gradient(180deg,#fff4ea,#ffe3cc); min-height: 100vh; }
  main { max-width: 520px; margin: 0 auto; padding: 64px 24px 96px; text-align: center; }
  .eyebrow { font-size: 15px; color: #6b5240; margin: 0 0 6px; }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 12px; word-break: keep-all; }
  p { margin: 0 0 24px; color: #4a3626; }
  .btn { display: block; padding: 16px 20px; margin: 12px 0; border-radius: 14px; font-weight: 600; text-decoration: none; }
  .primary { background: #F66B55; color: #fff; }
  .secondary { background: #fff; color: #c9402c; border: 1px solid rgba(0,0,0,.08); }
  footer { margin-top: 40px; font-size: 13px; color: #6b5240; }
  footer a { color: #c9402c; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">댕오늘 · 강아지와 오늘 어디 가지</p>
  <h1 id="name">강아지와 갈 수 있는 곳</h1>
  <p id="hint">댕오늘 앱에서 동반 조건, 영업시간, 오늘 산책 지수까지 같이 봐요.</p>
  <a class="btn primary" id="store" href="https://apps.apple.com/app/id6826581588">App Store에서 댕오늘 받기</a>
  <a class="btn secondary" id="open" href="#">이미 댕오늘이 있다면 앱에서 열기</a>
  <footer><a href="https://younatics.github.io/apps/pawday/">댕오늘 소개</a> · <a href="https://younatics.github.io/apps/pawday/privacy/">개인정보</a></footer>
</main>
<script>
  // A shared link carries the place's 8-character code (?c=, PawdayLinks.code in the app); its name comes from the nightly index
  // /apps/pawday/p/i/<first character>.json (tools/linkcodes.py). Links shared before the code carry the name itself (?n=) and the
  // id (?id=). Text only — never HTML.
  const q = new URLSearchParams(location.search);
  const show = (name) => { if (name) { document.getElementById('name').textContent = name; document.title = name + ' — 댕오늘'; } };
  show((q.get('n') || '').trim());
  const code = (q.get('c') || '').trim().toLowerCase();
  if (/^[0-9a-z]{8}$/.test(code)) {
    fetch('/apps/pawday/p/i/' + code[0] + '.json').then((r) => (r.ok ? r.json() : {})).then((index) => show(index[code])).catch(() => {});
  }
  // pawday://p?id=… — Instagram's and KakaoTalk's in-app browsers do not hand universal links to apps, and a same-domain tap in Safari
  // stays in Safari; the custom scheme opens the app from both (iOS asks once).
  const kind = location.pathname.split('/').filter(Boolean).pop();
  document.getElementById('open').setAttribute('href', 'pawday://' + kind + location.search);
  const banner = document.querySelector('meta[name="apple-itunes-app"]');
  banner.setAttribute('content', 'app-id=6826581588, app-argument=' + location.href);
  // The App Store button names its campaign (an Instagram post's `s=ig_<key>`, docs/INSTAGRAM_GROWTH.md §8-2) so App Analytics counts
  // installs per post: ct is the tag when it is 1 to 40 of A-Z a-z 0-9 _ . -, else "landing"; pt is the campaign provider token (public).
  function storeURL(search) {
    const s = new URLSearchParams(search).get('s') || '';
    return 'https://apps.apple.com/app/apple-store/id6826581588?pt=33832800&ct=' + (/^[A-Za-z0-9_.-]{1,40}$/.test(s) ? s : 'landing') + '&mt=8';
  }
  document.getElementById('store').setAttribute('href', storeURL(location.search));
  // Kyle 2026-10-29 "깔려있으면 이동하고, 아니면 웹페이지": an in-app browser (KakaoTalk, Instagram, …) never hands a universal link
  // to the app, so the page opens the app itself; without the app nothing happens and this page stays. Not Safari or Chrome: without
  // the app they say the address is invalid, and a link tapped in Messages or Mail has opened the app before this page loads.
  function opensApp(ua) {
    if (!/iPhone|iPad|iPod/.test(ua)) return false;
    if (/KAKAOTALK|Instagram|Barcelona|FBAN|FBAV|FB_IAB|NAVER\(inapp|DaumApps|Line\/|BAND\/|Twitter/.test(ua)) return true;
    return !/Safari\//.test(ua);   // another app's bare web view; Safari, Chrome, Firefox and Edge all name Safari
  }
  if (opensApp(navigator.userAgent)) location.href = 'pawday://' + kind + location.search;
</script>
</body>
</html>
